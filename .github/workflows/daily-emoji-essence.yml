name: Daily Emoji Essence (AI)

on:
  schedule:
    # Run once daily (essence post)
    - cron: "0 20 * * *"   # 20:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          pip install feedparser pillow requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run AI emoji selection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_emojis_ai.py

      - name: Prepare essence post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_TYPE: essence
        run: python scripts/prepare_daily_post.py

      - name: Generate Instagram image
        run: python scripts/generate_emoji_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/today.json data/history.json public/images/daily/*.png || true
          git commit -m "chore(auto): Essence post $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 180 seconds for GitHub Pages to deploy the image..."
          sleep 180

      - name: Pull latest changes before Instagram post
        run: |
          git pull --rebase

      - name: Post to Instagram
        if: success()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_instagram.py
        continue-on-error: true

      - name: Commit Instagram post log
        if: always()
        run: |
          git add data/instagram_posted.json || true
          git diff --staged --quiet || git commit -m "chore(auto): Update Instagram post log" || true
          git push || true

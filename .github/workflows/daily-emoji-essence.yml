name: Daily Emoji Essence (AI)

on:
  schedule:
    # Run once daily (essence post)
    - cron: "0 20 * * *"   # 20:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          pip install feedparser pillow requests playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Pull latest data (today.json from normal posts)
        run: |
          git fetch origin main
          git checkout origin/main -- public/data/today.json

      - name: Prepare essence post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POST_TYPE: essence
        run: python scripts/prepare_daily_post.py

      - name: Generate Instagram image
        run: python scripts/generate_emoji_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/today.json data/history.json public/images/daily/*.png || true
          git commit -m "chore(auto): Essence post $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push


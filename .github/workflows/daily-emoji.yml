name: Daily Emoji Update (AI)

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 08:00 Singapore
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install feedparser pillow requests

      - name: Run AI emoji selection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_emojis_ai.py

      - name: Generate Instagram image
        run: python scripts/generate_emoji_image.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/today.json data/history.json public/images/daily/*.png || true
          git commit -m "chore(auto): AI-picked emojis $(date -u +'%Y-%m-%d')" || echo "No changes"
          git push

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting 60 seconds for GitHub Pages to deploy the image..."
          sleep 60

      - name: Post to Instagram
        if: success()
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_to_instagram.py
        continue-on-error: true
